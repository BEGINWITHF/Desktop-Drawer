name: Release

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build update package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^app-v',''
          $stage = Join-Path $env:RUNNER_TEMP 'DesktopDrawer-release'
          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          dotnet publish src/DesktopDrawer/DesktopDrawer.csproj -c Release -r win-x64 --self-contained false -p:Version=$version -o $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/DesktopDrawer.Watchdog/DesktopDrawer.Watchdog.csproj -c Release -r win-x64 --self-contained false -o $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $zip = Join-Path $env:RUNNER_TEMP 'DesktopDrawer-win-x64.zip'
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  DesktopDrawer-win-x64.zip" -NoNewline

          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^app-v',''
          $stage = Join-Path $env:RUNNER_TEMP 'DesktopDrawer-release'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          $output = Join-Path $env:RUNNER_TEMP 'DesktopDrawer-installer'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $productVersion = ($version -split '-')[0] + '.0'

          & $iscc "/DAppVersion=$version" "/DProductVersion=$productVersion" "/DSourceDir=$stage" "/DOutputDir=$output" "installer/DesktopDrawer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Join-Path $output "DesktopDrawer-Setup-$version.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$installer.sha256" -Value "$hash  DesktopDrawer-Setup-$version.exe" -NoNewline

          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build online installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^app-v',''
          $stage = Join-Path $env:RUNNER_TEMP 'DesktopDrawer-bootstrap'
          dotnet publish src/DesktopDrawer.Bootstrap/DesktopDrawer.Bootstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bootstrap = Join-Path $stage 'DesktopDrawer-Installer.exe'

          $installer = $env:INSTALLER
          $alias = Join-Path (Split-Path $installer) 'DesktopDrawer-Setup.exe'
          Copy-Item $installer $alias -Force
          $hash = (Get-FileHash $alias -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$alias.sha256" -Value "$hash  DesktopDrawer-Setup.exe" -NoNewline

          "BOOTSTRAP=$bootstrap" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_ALIAS=$alias" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = $env:ZIP
          $installer = $env:INSTALLER
          $tag = "${{ github.ref_name }}"
          $arguments = @(
            $tag,
            $zip,
            "$zip.sha256",
            $installer,
            "$installer.sha256",
            $env:BOOTSTRAP,
            $env:SETUP_ALIAS,
            "$env:SETUP_ALIAS.sha256",
            '--title', "Desktop Drawer $tag",
            '--notes', "Desktop Drawer $tag"
          )
          if ($tag -match '-') {
            $arguments += '--prerelease'
          }
          gh release create @arguments
