name: Bug report
description: Report a problem with Desktop Drawer.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A short description and the steps to reproduce are enough; the rest is optional.

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: When I ..., Desktop Drawer ...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: desktop_drawer_version
    attributes:
      label: Desktop Drawer version
      description: Optional. Shown in Settings → ABOUT.
      placeholder: "1.0.0"
    validations:
      required: false

  - type: input
    id: windows_version
    attributes:
      label: Windows version
      description: Optional. Run `winver` if you know it.
      placeholder: Windows 11 23H2 (22631.xxxx)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Paste any relevant lines from `%APPDATA%\DesktopDrawer\desktop-drawer.log`.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Optional. Drag images here or add anything else that helps.
    validations:
      required: false
