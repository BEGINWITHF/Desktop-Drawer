<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Desktop Drawer 安装器预览</title>
<style>
  :root{
    --text:#f7f7fa; --secondary:#c9c9d1; --muted:#8f8f9a;
    --panel:rgba(8,8,8,.82);
    --line:rgba(255,255,255,.24); --line-soft:rgba(255,255,255,.11);
    --hover:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:
      radial-gradient(900px 500px at 78% 22%,rgba(108,92,231,.22),transparent 60%),
      radial-gradient(700px 420px at 18% 78%,rgba(52,152,219,.16),transparent 60%),
      #0a0a10;
    font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    color:var(--text);-webkit-font-smoothing:antialiased;
  }
  .window{
    width:520px;background:var(--panel);border:1px solid var(--line);
    padding:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
  }
  .head{display:flex;align-items:center;gap:12px}
  .brand{margin-right:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .brand img{width:26px;height:26px;display:block}
  .brand img{width:22px;height:22px;display:block}
  .logo{display:grid;place-items:center}
  .logo img{width:40px;height:40px;display:block}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.1px}
  .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .divider{height:1px;background:var(--line-soft);margin:18px 0}
  .status{font-size:13px;color:var(--secondary);min-height:20px}
  .meta{font-size:11px;color:var(--muted);margin-top:4px;min-height:16px}
  .track{height:4px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden;margin-top:14px}
  .bar{height:100%;width:0;background:#fff;border-radius:99px;transition:width .18s ease}
  .row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:20px}
  button{
    height:32px;padding:0 18px;font:inherit;font-size:12.5px;
    color:var(--text);background:transparent;border:1px solid var(--line);
    cursor:pointer;transition:background .15s;
  }
  button:hover:not(:disabled){background:var(--hover)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:#fff;border-color:#fff;color:#101014;font-weight:600}
  button.primary:hover:not(:disabled){background:#f0f0f4}
</style>
</head>
<body>
  <div class="window">
    <div class="head">
      <div class="logo">
        <img src="../src/DesktopDrawer/Assets/app.png" alt="Desktop Drawer">
      </div>
      <div>
        <h1>Desktop Drawer</h1>
        <div class="sub">A paged desktop</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="status" id="status">正在获取最新版本…</div>
    <div class="meta" id="meta">&nbsp;</div>
    <div class="track"><div class="bar" id="bar"></div></div>

    <div class="row">
      <div class="brand">
        <img src="team-daydream.png" alt="Team Daydream">
        <span>Team Daydream</span>
      </div>
      <button id="close">取消</button>
      <button class="primary" id="install" disabled>安装</button>
    </div>
  </div>
<script>
  const status = document.getElementById('status');
  const meta = document.getElementById('meta');
  const bar = document.getElementById('bar');
  const install = document.getElementById('install');
  const close = document.getElementById('close');
  let installed = false;

  setTimeout(() => {
    status.textContent = '发现新版本 1.0.0-beta.1';
    meta.textContent = '将下载并安装 Desktop Drawer 1.0.0-beta.1 · 约 2.2 MB';
    install.disabled = false;
  }, 600);

  install.onclick = () => {
    if (installed) { status.textContent = '正在启动 Desktop Drawer…'; return; }
    install.disabled = true;
    let p = 0;
    status.textContent = '正在下载…';
    meta.textContent = '1.0.0-beta.1';
    const timer = setInterval(() => {
      p = Math.min(1, p + 0.04 + Math.random() * 0.05);
      bar.style.width = (p * 100) + '%';
      meta.textContent = '已下载 ' + Math.round(p * 100) + '%';
      if (p >= 1) {
        clearInterval(timer);
        status.textContent = '正在校验安装包…';
        setTimeout(() => {
          status.textContent = '正在安装…';
          setTimeout(() => {
            status.textContent = '安装完成';
            meta.textContent = 'Desktop Drawer 已是最新版本';
            installed = true;
            install.textContent = '启动';
            install.disabled = false;
            close.textContent = '关闭';
          }, 900);
        }, 700);
      }
    }, 120);
  };

  close.onclick = () => { status.textContent = '窗口已关闭（预览）'; };
</script>
</body>
</html>
